<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>.......</title>
</head>
<body class="fart">
    <style>
        body {
            overflow: hidden;
            margin: 0;
        }
        b {
            display: inline-block;
            background-color: white;
            padding: 1vw;
        }
        .fart b {
            filter: invert(1);
        }
        div {
            display: flex;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        p {
            font-size: 15vw;
            text-align: center;
            overflow: hidden;
        }
    </style>

    <script>
        window.setInterval(() => {
            document.body.className = document.body.className == "fart" ? "" : "fart";
        }, 300);
    </script>

    <div>
        <p>🫵 <b>N E R D</b> 🫵</p>
    </div>
</body>
</html>
